prefix = "<grey>[<dark_red>Crystalixs<gray>] <reset>"
command {
  core {
    description {
      main: "Hauptbefehl für die Konfiguration vom Core Plugin"
      reload = "Läd die Config neu"
    }
    reload = "<prefix><gray>Die Konfiguration wurde neu geladen."
  }
  maintenance {
    description {
      main = "Toggelt den Wartungsmodus für den Proxy"
      state = "Status des Wartungsmodus (true/false)"
    }
    enabled = "<prefix><gray>Der Wartungsmodus wurde <green>aktiviert<gray>."
    disabled = "<prefix><gray>Der Wartungsmodus wurde <red>deaktiviert<gray>."
    error {
      already_enabled = "<prefix><red>Der Wartungsmodus ist bereits aktiviert.<gray>"
      already_disabled = "<prefix><red>Der Wartungsmodus ist bereits deaktiviert.<gray>"
    }
  }
  help {
    description {
      main = "Zeigt dieses Hilfemenü"
      query = "Zeigt das Hilfemenü für einen Befehl"
    }
  }
  proxy-stop {
    description = "Stoppt den Proxyserver"
  }
  global-find {
    description = {
      main = "Findet den Backend-Server eines Spielers"
      player = "Der Name des gesuchten Spielers"
    }
    error {
      not-connected = "<prefix><red>Dieser Spieler ist derzeit mit keinem Server verbunden!"
    }
    teleport {
      button = "<green><bold>[Join]"
      hover = "<gray>Klicke zum Teleportieren"
    }
    success = "<prefix><gray>Der Spieler <gold><name> <gray>befindet sich auf dem Server <aqua><server><gray>. <button>"
  }

  global-teleport {
    description = {
      main = "Teleportiert dich auf den Server des angegebenen Spielers"
      player = "Der Name des gesuchten Spielers"
    }
    error {
      not-connected = "<prefix><red>Dieser Spieler ist derzeit mit keinem Server verbunden!"
      same-server = "<prefix><red>Du befindest dich bereits auf diesem Server!"
    }
    success = "<prefix><gray>Du wist zu <gold><name> <gray>auf den Server <aqua><server> <gray>verbunden."
  }

  online = {
    description {
      main = "Prüft, ob ein Server gerade online oder offline ist"
      server = "Der zu überprüfende Server"
    }
    status = "<prefix><gray>Der Server <gold><server> <gray>ist gerade <status:'<green>online':'<red>offline'><gray>."
  }
}