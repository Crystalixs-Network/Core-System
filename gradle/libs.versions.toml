[versions]
resourceFactory = "1.3.1"
runServer = "3.0.2"
velocity = "3.5.0-SNAPSHOT"
cloud = "2.0.0-beta.10"
adventure = "4.26.1"
configurate = "4.2.0"

[libraries]
# Server software
paper = { group = "io.papermc.paper", name = "paper-api", version = "1.21.11-R0.1-SNAPSHOT" }
velocity = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }

# Configuration
configurate-hocon = { group = "org.spongepowered", name = "configurate-hocon", version.ref = "configurate" }
configurate-jackson = { group = "org.spongepowered", name = "configurate-jackson", version.ref = "configurate" }

# Command
cloud-core = { group = "org.incendo", name = "cloud-core", version = "2.0.0" }
cloud-paper = { group = "org.incendo", name = "cloud-paper", version.ref = "cloud" }
cloud-velocity = { group = "org.incendo", name = "cloud-velocity", version.ref = "cloud" }
cloud-minecraftExtras = { group = "org.incendo", name = "cloud-minecraft-extras", version.ref = "cloud" }
brigadier = { group = "com.mojang", name = "brigadier", version = "1.0.18" }

# Utility
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }

[plugins]
bukkitConvention = { id = "xyz.jpenilla.resource-factory-bukkit-convention", version.ref = "resourceFactory" }
velocityConvention = { id = "xyz.jpenilla.resource-factory-velocity-convention", version.ref = "resourceFactory" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runServer" }
runVelocity = { id = "xyz.jpenilla.run-velocity", version.ref = "runServer" }
shadow = { id = "com.gradleup.shadow", version = "9.3.1" }

[bundles]
cloudPaper = ["cloud-paper", "cloud-minecraftExtras", ]
cloudVelocity = ["cloud-velocity", "cloud-minecraftExtras"]
adventure = ["adventure-api", "adventure-text-minimessage"]
configurate = ["configurate-hocon", "configurate-jackson"]