name: Close Issues On Development Merge

on:
  pull_request:
    types: [closed]
    branches: [development]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close_linked_issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Close referenced issues from PR body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";

            // Supports: close(s|d), fix(es|ed), resolve(s|d) with #123 references
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const issueNumbers = new Set();
            let match;

            while ((match = pattern.exec(body)) !== null) {
              issueNumbers.add(Number(match[1]));
            }

            if (issueNumbers.size === 0) {
              core.info("No closing keywords with issue references found in PR body.");
              return;
            }

            for (const issue_number of issueNumbers) {
              core.info(`Closing issue #${issue_number}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: "closed"
              });
            }
